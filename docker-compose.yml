# Local development services. The API and web app run on the host under pnpm
# during Day 1 and 2; the API joins this stack as a container in Day 1 block 5.
#
#   pnpm db:up      start everything
#   pnpm db:reset   wipe the volumes and start fresh
#
# Adminer is on http://localhost:8080. LocalStack's S3 is on http://localhost:4566.
#
# The build plan specified MinIO for object storage, but MinIO's images are no
# longer pullable from Docker Hub (every tag, not just latest, returns access
# denied). LocalStack replaces it: it speaks the real S3 API, so the same
# AWS SDK code runs locally and against S3 in production with only the endpoint
# changing.

name: golden-spoon

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golden_spoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golden_spoon}
      POSTGRES_DB: ${POSTGRES_DB:-golden_spoon}
      # Africa/Lagos everywhere, so timestamps in psql match the restaurant's day.
      TZ: Africa/Lagos
      PGTZ: Africa/Lagos
    ports:
      # 5433 on the host, not 5432: this machine runs a Homebrew postgresql@17
      # bound to 127.0.0.1:5432, and a specific bind beats Docker's wildcard for
      # localhost connections — so :5432 would silently reach the wrong server.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-golden_spoon} -d ${POSTGRES_DB:-golden_spoon}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack:
    # Pinned deliberately: from 2026.x the image demands LOCALSTACK_AUTH_TOKEN
    # and exits 55 without one. 4.5 is the last line that runs free.
    image: localstack/localstack:4.5
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${S3_REGION:-eu-west-2}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-golden-spoon-media}
    ports:
      - '4566:4566'
    volumes:
      - localstack-data:/var/lib/localstack
      # Runs once the S3 API is accepting requests. Creates the media bucket so
      # the API never has to special-case "bucket does not exist yet".
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3 ls || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '8080:8080'

volumes:
  postgres-data:
  localstack-data:
